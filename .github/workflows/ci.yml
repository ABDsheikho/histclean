name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test

  man:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Generate and push man page if scdoc source changed
        run: |
          if ! git diff --name-only HEAD~1 | grep -q 'doc/man/.*\.scdoc'; then
            echo "No changes to any .scdoc files — skipping man page update"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y scdoc
          zig build man
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add doc/man/histclean.1
          git diff --staged --quiet || git commit -m "Auto generate & update man pages"
          git push
